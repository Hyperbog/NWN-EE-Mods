name: Enhanced First Person Windows package
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/first-person/milestones/**/*.patch'
      - 'src/first-person/BUILD_PLAN.json'
      - 'src/first-person/managed/**/*.cs'
      - 'src/first-person/SOURCE_MANIFEST.json'
      - 'tools/cloud_build.py'
      - 'tools/Install-EFP.ps1'
      - 'tools/tests/Test-Install-EFP.ps1'
      - '.github/workflows/efp-windows.yml'
permissions:
  contents: read
concurrency:
  group: efp-build-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 50
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test portable installer against disposable runtime
        shell: powershell
        run: ./tools/tests/Test-Install-EFP.ps1
      - name: Reconstruct exact source
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch cx-build-base --single-branch "https://github.com/$GITHUB_REPOSITORY.git" cx-build
          git -C cx-build checkout --detach 2470f0d27be0a29c152456aa60222f1f4fc25c34
          git -C cx-build submodule update --init --recursive
          python tools/cloud_build.py stage
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Build native Windows package
        shell: bash
        working-directory: cx-build
        run: |
          set -euo pipefail
          ./build-win-native.sh
      - name: Verify all five DLLs and package manifest
        run: python tools/cloud_build.py package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: efp-windows-release
          path: dist/*
          if-no-files-found: error
      - name: Preserve native build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: efp-build-diagnostics
          path: cx-build/build-managed-win.log
          if-no-files-found: ignore
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: efp-windows-release
          path: dist
      - name: Publish uniquely versioned test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          version=$(jq -r .version dist/release-manifest.json)
          [[ "$version" =~ ^M[0-9]+(-[A-Za-z0-9]+)?$ ]]
          tag="efp-$version-$GITHUB_SHA"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Enhanced First Person $version" \
            --notes "Native Windows package; gameplay verification pending. See release-manifest.json for exact source and binary hashes." \
            dist/*
