name: Enhanced First Person Windows package
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/first-person/BUILD_PLAN.json'
      - 'tools/cloud_build.py'
      - 'tools/Install-EFP.ps1'
      - 'tools/tests/Test-Install-EFP.ps1'
      - 'tools/diagnostics/**'
      - '.github/workflows/efp-windows.yml'
permissions:
  contents: read
concurrency:
  group: efp-build-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 50
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test archive integrity with and without Python optimization
        shell: pwsh
        run: |
          python tools/tests/test_cloud_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O tools/tests/test_cloud_package.py
      - name: Test portable installer against disposable runtime
        shell: powershell
        run: ./tools/tests/Test-Install-EFP.ps1
      - name: Check out and verify pinned CX source
        run: python tools/cloud_build.py checkout
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.401
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Build native Windows package
        shell: bash
        working-directory: cx-build
        run: |
          set -euo pipefail
          ./build-win-native.sh
      - name: Verify all five DLLs and package manifest
        run: python tools/cloud_build.py package-direct
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: efp-windows-release
          path: dist/*
          if-no-files-found: error
      - name: Preserve native build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: efp-build-diagnostics
          path: cx-build/build-managed-win.log
          if-no-files-found: ignore
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: efp-windows-release
          path: dist
      - name: Publish uniquely versioned direct-source test release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          jq -e --arg commit "$GITHUB_SHA" '.build_mode == "direct" and .mod_source_commit == $commit and .cx_source_repository == "Hyperbog/cx" and (.cx_source_commit | test("^[0-9a-f]{40}$")) and (.cx_source_tree | test("^[0-9a-f]{40}$")) and .patches == []' dist/release-manifest.json
          version=$(jq -r .version dist/release-manifest.json)
          [[ "$version" =~ ^M[0-9]+(-[A-Za-z0-9]+)?$ ]]
          tag="efp-$version-$GITHUB_SHA"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Enhanced First Person $version" \
            --notes "Direct-source native Windows package; gameplay verification pending. See release-manifest.json for distribution commit, CX commit/tree and binary hashes." \
            dist/*
